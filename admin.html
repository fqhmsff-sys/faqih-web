<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Faqih Musyaffa</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body class="protected"><header class="nav"><a class="brand" href="index.html">FAQIH</a><nav><a href="index.html">HOME</a><a href="projects.html">PROJECTS</a><a href="career.html">CAREER</a><a href="moments.html">MOMENTS</a><a href="words.html">WORDS</a></nav></header><main class="page-main protected-main"><section class="page-hero"><div class="page-actions"><a class="back" href="index.html">← HOME</a><a class="back" href="word-editor.html">WORDS EDITOR</a></div><p class="eyebrow">PRIVATE / ADMIN</p><h1>Manage<br><em>Site.</em></h1></section><section class="section editor"><div class="add-form"><p class="eyebrow">ADD CONTENT</p><h2>Tambahkan.</h2><div class="add-form-grid"><select id="type"><option value="project">Project</option><option value="career">Career</option><option value="moment">Moment</option></select><input id="title" placeholder="Judul / nama"><input id="date" placeholder="Tanggal / status"></div><textarea id="description" placeholder="Deskripsi"></textarea><div style="margin-top:10px"><input id="path" placeholder="Path foto untuk Moment, contoh: images/moment-03.jpg"></div><button id="add" style="margin-top:10px">TAMBAH</button><p id="status" class="error"></p></div><div class="editor-toolbar"><div><p class="eyebrow">CURRENT DATA</p><div class="editor-status" id="summary"></div></div><button id="export">EXPORT site-data.js</button></div><div id="current" class="project-status-grid"></div></section></main><div class="site-auth-gate" id="siteAuthGate"><div class="auth-box"><p class="eyebrow">PROTECTED</p><h2>Admin.</h2><p>Halaman ini hanya untuk mengelola isi website.</p><form id="siteAuthForm"><input id="siteAuthPassword" type="password" placeholder="Sandi" autocomplete="current-password" required><button>BUKA</button></form><p id="siteAuthError" class="error"></p></div></div><footer><p>FAQIH MUSYAFFA</p><span>Private admin.</span></footer><script src="data.js"></script><script src="site-data.js"></script><script src="auth.js"></script><script src="site-auth.js"></script><script>(function(){let data=JSON.parse(JSON.stringify(SITE_ADDITIONS));const $=id=>document.getElementById(id);function render(){const all=[...data.projects.map(x=>({type:'PROJECT',title:x.title,meta:x.status||x.date,desc:x.description})),...data.career.map(x=>({type:'CAREER',title:x.title,meta:x.type,desc:x.description})),...data.moments.map(x=>({type:'MOMENT',title:x.caption,meta:x.path,desc:x.alt}))];$('summary').textContent=`${all.length} tambahan`;$('current').innerHTML=all.length?all.map(x=>`<article><span>${x.type}</span><h3>${x.title||''}</h3><p>${x.meta||''}</p><p>${x.desc||''}</p></article>`).join(''):'<article><span>EMPTY</span><h3>Belum ada tambahan.</h3><p>Tambahkan konten dari form di atas.</p></article>'}$('add').onclick=()=>{const type=$('type').value,title=$('title').value.trim(),meta=$('date').value.trim(),desc=$('description').value.trim(),path=$('path').value.trim();if(!title){$('status').textContent='Isi judul/nama dulu.';return}if(type==='project')data.projects.push({title,status:meta||'IDEAS',description:desc});if(type==='career')data.career.push({type:meta||'CAREER',title,description:desc});if(type==='moment')data.moments.push({path:path||title,alt:desc||title,caption:title});$('title').value='';$('date').value='';$('description').value='';$('path').value='';$('status').textContent='Ditambahkan sementara. Export site-data.js untuk menerapkannya.';render()};$('export').onclick=()=>{const js=`const SITE_ADDITIONS = ${JSON.stringify(data,null,2)};\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));a.download='site-data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></body></html>
