<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Words Editor — Faqih Musyaffa</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body class="protected"><header class="nav"><a class="brand" href="index.html">FAQIH</a><nav><a href="words.html">WORDS</a><a href="index.html">HOME</a></nav></header><main class="page-main protected-main"><section class="page-hero"><div class="page-actions"><a class="back" href="words.html">← WORDS</a></div><p class="eyebrow">PRIVATE / WORD EDITOR</p><h1>Manage<br><em>Words.</em></h1></section><section class="section editor"><div class="editor-toolbar"><div><p class="eyebrow">ALL WORDS</p><div id="status" class="editor-status"></div></div><div class="editor-actions"><button id="add">+ ADD WORD</button><button id="export">EXPORT data.js</button><button id="reset" class="secondary">RESET</button></div></div><div id="grid" class="editor-grid"></div></section></main><div class="site-auth-gate" id="siteAuthGate"><div class="auth-box"><p class="eyebrow">PROTECTED</p><h2>Words Editor.</h2><p>Gunakan sandi yang sama dengan Private Words.</p><form id="siteAuthForm"><input id="siteAuthPassword" type="password" placeholder="Sandi" autocomplete="current-password" required><button>BUKA</button></form><p id="siteAuthError" class="error"></p></div></div><footer><p>FAQIH MUSYAFFA</p><span>Private editor.</span></footer><script src="data.js"></script><script src="auth.js"></script><script src="site-auth.js"></script><script>(function(){let words=[],password='';const $=id=>document.getElementById(id);const b64=v=>Uint8Array.from(atob(v),c=>c.charCodeAt(0));async function keyFor(p,salt,usage){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PRIVATE_BUNDLE.iterations,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,usage)}async function decrypt(p){const k=await keyFor(p,b64(PRIVATE_BUNDLE.salt),['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PRIVATE_BUNDLE.nonce)},k,b64(PRIVATE_BUNDLE.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){ $('status').textContent=`${words.length} tulisan`;$('grid').innerHTML=words.map((w,i)=>`<div class="editor-row"><div>${esc(w.id)}</div><input data-i="${i}" data-k="title" value="${esc(w.title||'')}" placeholder="Judul"><textarea data-i="${i}" data-k="text">${esc(w.text||'')}</textarea><select data-i="${i}" data-k="public"><option value="1" ${PUBLIC_WORDS.some(x=>x.id===w.id)?'selected':''}>PUBLIC</option><option value="0" ${PUBLIC_WORDS.some(x=>x.id===w.id)?'':'selected'}>PRIVATE</option></select></div>`).join('');document.querySelectorAll('[data-i]').forEach(el=>el.oninput=()=>{const i=+el.dataset.i,k=el.dataset.k;if(k==='public')return;words[i][k]=el.value});document.querySelectorAll('select[data-k="public"]').forEach(el=>el.onchange=()=>{el.dataset.public=el.value});}function syncPublic(){return Array.from(document.querySelectorAll('select[data-k="public"]')).map((el,i)=>el.value==='1'?words[i]:null).filter(Boolean)}async function encrypt(all){const salt=crypto.getRandomValues(new Uint8Array(16)),nonce=crypto.getRandomValues(new Uint8Array(12)),k=await keyFor(password,salt,['encrypt']),plain=new TextEncoder().encode(JSON.stringify(all)),cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce},k,plain));return {version:1,kdf:'PBKDF2-SHA256',iterations:PRIVATE_BUNDLE.iterations,salt:btoa(String.fromCharCode(...salt)),nonce:btoa(String.fromCharCode(...nonce)),ciphertext:btoa(String.fromCharCode(...cipher))}}window.addEventListener('site-authenticated',async()=>{password=window.siteAuthPassword;words=await decrypt(password);draw()});$('add').onclick=()=>{words.push({id:String(words.length+1).padStart(2,'0'),title:'',text:''});draw()};$('reset').onclick=async()=>{words=await decrypt(password);draw()};$('export').onclick=async()=>{const pub=syncPublic().map(({id,title,text})=>({id,title,text})),bundle=await encrypt(words.map(({id,title,text})=>({id,title,text})));const js=`const PUBLIC_WORDS=${JSON.stringify(pub)};\nconst PRIVATE_BUNDLE=${JSON.stringify(bundle)};\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));a.download='data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='data.js siap diupload.'}})();</script></body></html>
