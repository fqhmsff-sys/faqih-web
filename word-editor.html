<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Local Words Editor — Faqih Musyaffa"><title>Manage Words — Faqih Musyaffa</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg" type="image/svg+xml">
</head><body><header class="nav"><a class="brand" href="index.html">FAQIH</a><nav><a href="index.html#about">About</a><a href="index.html#journey">Journey</a><a href="index.html#likes">Likes</a><a href="projects.html">Projects</a><a href="career.html">Career</a><a href="words.html">Words</a><a href="moments.html">Moments</a><a href="index.html#future">Future</a></nav></header><main class="page-main"><section class="page-hero"><a class="back" href="words.html">← BACK TO WORDS</a><p class="eyebrow">LOCAL EDITOR</p><h1>Manage<br><em>Words.</em></h1></section><section class="section editor-section"><div class="editor-lock" id="editorLock"><p class="eyebrow">PRIVATE DATA</p><h2>Buka editor.</h2><p>Sandi hanya diproses di browser. Tidak dikirim ke server oleh halaman ini.</p><form id="editorUnlock"><input id="editorPassword" type="password" placeholder="Masukkan sandi Words" autocomplete="current-password" required><button type="submit">BUKA EDITOR</button></form><p id="editorError" class="error" aria-live="polite"></p></div><div class="editor-panel" id="editorPanel"><div class="editor-toolbar"><div><p class="eyebrow">ALL WORDS</p><div class="editor-status" id="editorStatus"></div></div><div class="editor-actions"><button id="addWord" type="button">+ ADD WORD</button><button id="downloadData" type="button">EXPORT data.js</button><button id="resetEditor" class="secondary" type="button">RESET</button></div></div><div id="editorGrid" class="editor-grid"></div></div></section></main><footer><p>FAQIH MUSYAFFA</p><span>Editor lokal untuk Words.</span><div class="footer-socials" aria-label="Social media">

</div></footer><script src="data.js"></script><script>
const state={words:[],password:'',iterations:PRIVATE_BUNDLE.iterations};
const $e=s=>document.querySelector(s);
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bytesToB64=b=>{let s='';const chunk=0x8000;for(let i=0;i<b.length;i+=chunk)s+=String.fromCharCode(...b.subarray(i,i+chunk));return btoa(s)};
async function keyFor(password,salt,usage){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:state.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,usage)}
async function decryptBundle(password){const key=await keyFor(password,b64ToBytes(PRIVATE_BUNDLE.salt),['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(PRIVATE_BUNDLE.nonce)},key,b64ToBytes(PRIVATE_BUNDLE.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function draw(){const grid=$e('#editorGrid');grid.innerHTML=state.words.map((w,i)=>`<div class="editor-row" data-index="${i}"><div class="id-field">${esc(w.id)}</div><input class="title-field" value="${esc(w.title||'')}" placeholder="Judul (opsional)"><textarea class="text-field" placeholder="Isi tulisan">${esc(w.text||'')}</textarea><select class="visibility"><option value="public" ${w.public?'selected':''}>PUBLIC</option><option value="private" ${!w.public?'selected':''}>PRIVATE</option></select></div>`).join('');$e('#editorStatus').textContent=`${state.words.length} tulisan · perubahan belum diexport`}
function sync(){document.querySelectorAll('.editor-row').forEach(row=>{const i=+row.dataset.index;state.words[i].title=row.querySelector('.title-field').value;state.words[i].text=row.querySelector('.text-field').value;state.words[i].public=row.querySelector('.visibility').value==='public'})}
async function encryptBundle(words,password){const salt=crypto.getRandomValues(new Uint8Array(16)),nonce=crypto.getRandomValues(new Uint8Array(12));const key=await keyFor(password,salt,['encrypt']);const plain=new TextEncoder().encode(JSON.stringify(words));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce},key,plain);return {version:1,kdf:'PBKDF2-SHA256',iterations:state.iterations,salt:bytesToB64(salt),nonce:bytesToB64(nonce),ciphertext:bytesToB64(new Uint8Array(cipher))}}
function download(filename,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$e('#editorUnlock').addEventListener('submit',async e=>{e.preventDefault();const err=$e('#editorError');err.textContent='';try{if(!window.crypto?.subtle)throw new Error('SECURE_CONTEXT');const password=$e('#editorPassword').value;const all=await decryptBundle(password);const publicSet=new Set(PUBLIC_WORDS.map(x=>x.id));state.password=password;state.words=all.map(w=>({...w,public:publicSet.has(w.id)}));for(const p of PUBLIC_WORDS){if(!state.words.some(w=>w.id===p.id))state.words.push({...p,public:true})}state.words.sort((a,b)=>Number(a.id)-Number(b.id));draw();$e('#editorLock').style.display='none';$e('#editorPanel').classList.add('open')}catch(err){err.textContent=err.message==='SECURE_CONTEXT'?'Buka website lewat HTTPS (misalnya GitHub Pages), bukan file lokal.':'Sandi salah atau data private tidak dapat dibuka.'}});
$e('#addWord').addEventListener('click',()=>{sync();const max=Math.max(0,...state.words.map(w=>Number(w.id)||0));state.words.push({id:String(max+1).padStart(2,'0'),title:'',text:'',public:false});draw();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});
$e('#resetEditor').addEventListener('click',async()=>{if(!confirm('Kembalikan editor ke data terakhir yang tersimpan?'))return;try{const all=await decryptBundle(state.password);const publicSet=new Set(PUBLIC_WORDS.map(x=>x.id));state.words=all.map(w=>({...w,public:publicSet.has(w.id)}));draw()}catch{}});
$e('#downloadData').addEventListener('click',async()=>{sync();const all=state.words.map(({id,title,text})=>({id,title,text}));const pub=state.words.filter(w=>w.public).map(({id,title,text})=>({id,title,text}));const bundle=await encryptBundle(all,state.password);const js=`const PUBLIC_WORDS=${JSON.stringify(pub)};\nconst PRIVATE_BUNDLE=${JSON.stringify(bundle)};\n`;download('data.js',js);$e('#editorStatus').textContent='data.js berhasil dibuat. Upload file itu ke GitHub untuk menerapkan perubahan.'});
</script></body></html>
