<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moments — Faqih Musyaffa</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><header class="nav"><a class="brand" href="index.html">FAQIH</a><nav><a href="index.html#about">ABOUT</a><a href="index.html#likes">LIKES</a><a href="projects.html">PROJECTS</a><a href="career.html">CAREER</a><a href="words.html">WORDS</a><a href="moments.html">MOMENTS</a></nav></header><main class="page-main"><section class="page-hero"><div class="page-actions"><a class="back" href="index.html">← HOME</a><a class="action-button" href="admin.html">+ ADD MOMENT</a></div><p class="eyebrow">MOMENTS</p><h1>Beberapa<br><em>momen.</em></h1></section><section class="section"><div class="moments-grid" id="momentsGrid"><figure class="moment-feature"><button class="photo-button" data-lightbox="images/faqih-child-1.jpg"><img src="images/faqih-child-1.jpg" alt="Faqih saat kecil, foto pertama"><span class="photo-expand">VIEW ↗</span></button><figcaption><span>01</span><span>Childhood / Jakarta</span></figcaption></figure><figure class="moment-side"><button class="photo-button" data-lightbox="images/faqih-child-2.jpg"><img src="images/faqih-child-2.jpg" alt="Faqih saat kecil, foto kedua"><span class="photo-expand">VIEW ↗</span></button><figcaption><span>02</span><span>Childhood</span></figcaption></figure></div></section></main><div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightboxClose">×</button><img id="lightboxImage" alt="Foto diperbesar"><div class="lightbox-caption">MOMENTS / FAQIH MUSYAFFA</div></div><footer><p>FAQIH MUSYAFFA</p><span>Website yang akan terus bertumbuh.</span></footer><script src="site-data.js"></script><script>(SITE_ADDITIONS.moments||[]).forEach((x,i)=>document.getElementById('momentsGrid').insertAdjacentHTML('beforeend',`<figure class="moment-side"><button class="photo-button" data-lightbox="${x.path}"><img src="${x.path}" alt="${x.alt||''}"><span class="photo-expand">VIEW ↗</span></button><figcaption><span>${String(i+3).padStart(2,'0')}</span><span>${x.caption||''}</span></figcaption></figure>`));const lb=document.getElementById('lightbox'),im=document.getElementById('lightboxImage');function closeLb(){lb.classList.remove('open');document.body.classList.remove('modal-open')}document.querySelectorAll('[data-lightbox]').forEach(b=>b.onclick=()=>{im.src=b.dataset.lightbox;lb.classList.add('open');document.body.classList.add('modal-open')});document.getElementById('lightboxClose').onclick=closeLb;lb.onclick=e=>{if(e.target===lb)closeLb()};document.onkeydown=e=>{if(e.key==='Escape')closeLb()};</script></body></html>
