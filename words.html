<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Words — Faqih Musyaffa</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><header class="nav"><a class="brand" href="index.html">FAQIH</a><nav><a href="index.html#about">ABOUT</a><a href="projects.html">PROJECTS</a><a href="career.html">CAREER</a><a href="words.html">WORDS</a><a href="moments.html">MOMENTS</a></nav></header><main class="page-main"><section class="page-hero"><div class="page-actions"><a class="back" href="index.html">← HOME</a><a class="action-button" href="word-editor.html">MANAGE WORDS</a></div><p class="eyebrow">WORDS</p><h1>Yang<br><em>tersimpan.</em></h1></section><section class="section"><div class="words-tabs"><button class="tab active" data-tab="public">PUBLIC</button><button class="tab" data-tab="private">PRIVATE · LOCKED</button></div><div id="publicWords" class="words-list"></div><div id="privateGate" class="private-gate hidden"><p class="eyebrow">PRIVATE</p><h3>Masukkan sandi.</h3><p>Bagian ini berisi seluruh koleksi tulisan.</p><form id="unlockForm"><input id="password" type="password" autocomplete="current-password" placeholder="Sandi" required><button>BUKA</button></form><p id="unlockError" class="error"></p></div><div id="privateWords" class="words-list hidden"></div></section></main><footer><p>FAQIH MUSYAFFA</p><span>Website yang akan terus bertumbuh.</span></footer><script src="data.js"></script><script src="auth.js"></script><script>(function(){const pub=document.getElementById('publicWords'),priv=document.getElementById('privateWords'),gate=document.getElementById('privateGate'),tabs=document.querySelectorAll('.tab');function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(el,arr){el.innerHTML=arr.map(w=>`<article class="word-card"><div class="word-id">${esc(w.id)}</div>${w.title?`<div class="word-title">${esc(w.title)}</div>`:''}<div class="word-text">${esc(w.text||'')}</div></article>`).join('')}draw(pub,PUBLIC_WORDS);tabs.forEach(tab=>tab.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));tab.classList.add('active');const privateTab=tab.dataset.tab==='private';pub.classList.toggle('hidden',privateTab);gate.classList.toggle('hidden',!privateTab);if(!privateTab)priv.classList.add('hidden')});document.getElementById('unlockForm').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('password'),err=document.getElementById('unlockError');err.textContent='';try{await FaqihAuth.verifyPassword(input.value);const b=PRIVATE_BUNDLE;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:Uint8Array.from(atob(b.salt),c=>c.charCodeAt(0)),iterations:b.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:Uint8Array.from(atob(b.nonce),c=>c.charCodeAt(0))},key,Uint8Array.from(atob(b.ciphertext),c=>c.charCodeAt(0)));const all=JSON.parse(new TextDecoder().decode(plain));draw(priv,all);gate.classList.add('hidden');priv.classList.remove('hidden')}catch(x){err.textContent='Sandi salah.';input.value='';input.focus()}}})();</script></body></html>
