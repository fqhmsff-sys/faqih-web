<script src="data.js"></script>

<script>

const state = {
  words: [],
  password: "",
  iterations: PRIVATE_BUNDLE.iterations
};


const $e = selector =>
  document.querySelector(selector);


const b64ToBytes = value =>
  Uint8Array.from(
    atob(value),
    char => char.charCodeAt(0)
  );


const bytesToB64 = bytes => {

  let output = "";

  const chunk = 0x8000;

  for (
    let i = 0;
    i < bytes.length;
    i += chunk
  ) {

    output += String.fromCharCode(
      ...bytes.subarray(i, i + chunk)
    );

  }

  return btoa(output);

};


async function keyFor(
  password,
  salt,
  usage
) {

  const material =
    await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );


  return crypto.subtle.deriveKey(

    {
      name: "PBKDF2",
      salt,
      iterations: state.iterations,
      hash: "SHA-256"
    },

    material,

    {
      name: "AES-GCM",
      length: 256
    },

    false,

    usage

  );

}


async function decryptBundle(password) {

  const key =
    await keyFor(
      password,
      b64ToBytes(PRIVATE_BUNDLE.salt),
      ["decrypt"]
    );


  const plain =
    await crypto.subtle.decrypt(

      {
        name: "AES-GCM",
        iv: b64ToBytes(
          PRIVATE_BUNDLE.nonce
        )
      },

      key,

      b64ToBytes(
        PRIVATE_BUNDLE.ciphertext
      )

    );


  return JSON.parse(
    new TextDecoder().decode(plain)
  );

}


function esc(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

}


function draw() {

  const grid =
    $e("#editorGrid");


  grid.innerHTML =
    state.words
      .map(
        (word, index) => `

          <div
            class="editor-row"
            data-index="${index}"
          >

            <div class="id-field">
              ${esc(word.id)}
            </div>


            <input
              class="title-field"
              value="${esc(word.title || "")}"
              placeholder="Judul (opsional)"
            >


            <textarea
              class="text-field"
              placeholder="Isi tulisan"
            >${esc(word.text || "")}</textarea>


            <select class="visibility">

              <option
                value="public"
                ${word.public ? "selected" : ""}
              >
                PUBLIC
              </option>

              <option
                value="private"
                ${!word.public ? "selected" : ""}
              >
                PRIVATE
              </option>

            </select>

          </div>

        `
      )
      .join("");


  $e("#editorStatus").textContent =
    `${state.words.length} tulisan · perubahan belum diexport`;

}


function sync() {

  document
    .querySelectorAll(".editor-row")
    .forEach(row => {

      const index =
        Number(row.dataset.index);


      state.words[index].title =
        row
          .querySelector(".title-field")
          .value;


      state.words[index].text =
        row
          .querySelector(".text-field")
          .value;


      state.words[index].public =
        row
          .querySelector(".visibility")
          .value === "public";

    });

}


async function encryptBundle(
  words,
  password
) {

  const salt =
    crypto.getRandomValues(
      new Uint8Array(16)
    );


  const nonce =
    crypto.getRandomValues(
      new Uint8Array(12)
    );


  const key =
    await keyFor(
      password,
      salt,
      ["encrypt"]
    );


  const plain =
    new TextEncoder().encode(
      JSON.stringify(words)
    );


  const cipher =
    await crypto.subtle.encrypt(

      {
        name: "AES-GCM",
        iv: nonce
      },

      key,

      plain

    );


  return {

    version: 1,

    kdf: "PBKDF2-SHA256",

    iterations:
      state.iterations,

    salt:
      bytesToB64(salt),

    nonce:
      bytesToB64(nonce),

    ciphertext:
      bytesToB64(
        new Uint8Array(cipher)
      )

  };

}


function download(
  filename,
  text
) {

  const url =
    URL.createObjectURL(
      new Blob(
        [text],
        {
          type:
            "text/javascript"
        }
      )
    );


  const link =
    document.createElement("a");


  link.href = url;

  link.download =
    filename;


  link.click();


  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


/*
  Global password gate sudah memastikan
  password yang benar.

  Kita tetap perlu password di state untuk
  melakukan encrypt/decrypt ketika editor
  bekerja. site-auth.js menyimpan password
  tersebut di window.siteAuthPassword.
*/

async function initializeEditor() {

  try {

    if (!window.siteAuthPassword) {

      $e("#editorStatus").textContent =
        "Editor belum terautentikasi.";

      return;

    }


    const password =
      window.siteAuthPassword;


    const all =
      await decryptBundle(
        password
      );


    const publicSet =
      new Set(
        PUBLIC_WORDS.map(
          word => word.id
        )
      );


    state.password =
      password;


    state.words =
      all.map(
        word => ({
          ...word,
          public:
            publicSet.has(word.id)
        })
      );


    for (
      const publicWord
      of PUBLIC_WORDS
    ) {

      if (
        !state.words.some(
          word =>
            word.id === publicWord.id
        )
      ) {

        state.words.push({
          ...publicWord,
          public: true
        });

      }

    }


    state.words.sort(
      (a, b) =>
        Number(a.id) -
        Number(b.id)
    );


    draw();


  } catch (error) {

    $e("#editorStatus").textContent =
      "Data Words tidak dapat dibuka.";

    console.error(error);

  }

}


$e("#addWord").addEventListener(
  "click",
  () => {

    sync();


    const max =
      Math.max(
        0,
        ...state.words.map(
          word =>
            Number(word.id) || 0
        )
      );


    state.words.push({

      id:
        String(max + 1)
          .padStart(2, "0"),

      title: "",

      text: "",

      public: false

    });


    draw();


    window.scrollTo({

      top:
        document.body.scrollHeight,

      behavior:
        "smooth"

    });

  }
);


$e("#resetEditor").addEventListener(
  "click",
  async () => {

    if (
      !confirm(
        "Kembalikan editor ke data terakhir yang tersimpan?"
      )
    ) {
      return;
    }


    try {

      const all =
        await decryptBundle(
          state.password
        );


      const publicSet =
        new Set(
          PUBLIC_WORDS.map(
            word => word.id
          )
        );


      state.words =
        all.map(
          word => ({
            ...word,
            public:
              publicSet.has(word.id)
          })
        );


      draw();


    } catch {

      $e("#editorStatus").textContent =
        "Reset gagal.";

    }

  }
);


$e("#downloadData").addEventListener(
  "click",
  async () => {

    try {

      sync();


      const all =
        state.words.map(
          ({
            id,
            title,
            text
          }) => ({
            id,
            title,
            text
          })
        );


      const pub =
        state.words
          .filter(
            word =>
              word.public
          )
          .map(
            ({
              id,
              title,
              text
            }) => ({
              id,
              title,
              text
            })
          );


      const bundle =
        await encryptBundle(
          all,
          state.password
        );


      const js =
        `const PUBLIC_WORDS=${JSON.stringify(pub)};\n` +
        `const PRIVATE_BUNDLE=${JSON.stringify(bundle)};\n`;


      download(
        "data.js",
        js
      );


      $e("#editorStatus").textContent =
        "data.js berhasil dibuat. Upload file itu ke GitHub untuk menerapkan perubahan.";

    } catch {

      $e("#editorStatus").textContent =
        "Export gagal.";

    }

  }
);

</script>


<script src="site-auth.js"></script>

<script>

/*
  Tunggu sampai site-auth.js selesai
  memverifikasi password.
*/

const authReady =
  setInterval(
    () => {

      if (
        window.siteAuthPassword
      ) {

        clearInterval(authReady);

        initializeEditor();

      }

    },
    50
  );

</script>
